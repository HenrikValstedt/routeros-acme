# Builds the container image for amd64, arm64 and arm/v7 and publishes it to
# ghcr.io/henrikvalstedt/routeros-acme.
#
#   push to main        -> :latest and :sha-<short>
#   tag v1.2.3          -> :1.2.3, :1.2 and :sha-<short>
#   pull request        -> tests and build only, nothing is published
#   manual run          -> same as a push to the branch it runs on
#   weekly schedule     -> tests and govulncheck only
name: container image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]           # path filters don't apply to tags: releases always build
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"     # weekly: tests and govulncheck catch new advisories (no image is published)

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/henrikvalstedt/routeros-acme

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable   # the newest Go, like golang:1.27-alpine in the Dockerfile; govulncheck checks its standard library
          check-latest: true
      - run: go vet ./...
      - run: go test ./...   # the real-router test is skipped without ROS_HOST
      # Fails when the code calls a function with a known vulnerability.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  image:
    needs: test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Cross-compiled in the Dockerfile, so no QEMU is needed for arm64 / arm/v7.
      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="main-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: VERSION=${{ steps.ver.outputs.version }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
