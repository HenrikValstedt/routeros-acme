# Builds the container image for amd64, arm64 and arm/v7 and publishes it to
# ghcr.io/henrikvalstedt/routeros-acme.
#
#   push to main        -> :latest and :sha-<short>
#   tag v1.2.3          -> :1.2.3, :1.2 and :sha-<short>
#   pull request        -> tests and build only, nothing is published
#   manual run          -> same as a push to the branch it runs on
#   weekly schedule     -> tests and govulncheck only
name: container image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]           # path filters don't apply to tags: releases always build
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"     # weekly: tests and govulncheck catch new advisories (no image is published)

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/henrikvalstedt/routeros-acme

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to exact commits (a moved tag can't change what runs); Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"   # newest 1.27.x, the same as golang:1.27-alpine in the Dockerfile (and go.mod)
          check-latest: true
      - run: go vet ./...
      - run: go test ./...   # the real-router test is skipped without ROS_HOST
      # Fails when the code calls a function with a known vulnerability. Its version is pinned
      # in go.mod (a "tool" dependency, checked by go.sum) and updated by Dependabot.
      - run: go tool govulncheck ./...

  image:
    needs: test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cross-compiled in the Dockerfile, so no QEMU is needed for arm64 / arm/v7.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="main-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: VERSION=${{ steps.ver.outputs.version }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
