services:
  routeros-acme:
    image: ghcr.io/henrikvalstedt/routeros-acme:latest
    # build: .                 # uncomment to build from source instead of pulling (see BUILD.md)
    container_name: routeros-acme
    restart: unless-stopped
    stop_grace_period: 30s     # lets a running renewal or deploy finish when stopping/updating
    ports:
      - "8080:8080"            # behind a reverse proxy: remove this, or use "127.0.0.1:8080:8080"
    environment:
      TZ: UTC          # set your timezone, e.g. Europe/Berlin
      # First run: the log prints a setup code; open the UI to create the admin account.
      # Or create the admin non-interactively (only used while no users exist):
      # ADMIN_USER: admin
      # ADMIN_PASSWORD: change-me-please
      # Behind a reverse proxy (see README):
      # TRUSTED_PROXIES: 172.16.0.0/12   # proxy address(es)/CIDRs, or "private"
      # BASE_PATH: /certs                # only when served under a sub-path
      # COOKIE_SECURE: "true"            # force Secure cookie (auto when proxy sends X-Forwarded-Proto: https)
      # Hardened setup (optional, see README): keep the encryption key out of the data folder
      # SECRET_KEY_FILE: /run/secrets/routeros_acme_key
    volumes:
      - ./data:/data
    # secrets:
    #   - routeros_acme_key
    # Hardening: nothing to set up. The app starts as root only to hand /data to an
    # unprivileged user, then runs as that user without any privileges.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, SETUID, SETGID]   # used only during the first moment of startup

# secrets:
#   routeros_acme_key:
#     file: /path/outside/the/data/folder/routeros-acme.key   # e.g. created with: openssl rand -base64 32 > routeros-acme.key
